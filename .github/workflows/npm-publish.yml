name: npm-publish

on:
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Guard main branch
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then

            echo "npm publishing is only allowed from main, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Reject reruns
        run: test "$GITHUB_RUN_ATTEMPT" = "1"

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports Trusted Publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec lefthook install
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - run: pnpm build-storybook
      - run: pnpm docs:check

      # This workflow is manual release work. Publishing below reuses this exact
      # CI-inspected artifact; package validation must not silently repack it.
      - name: Pack verified candidate
        run: pnpm pack --out .scratch/release-candidate.tgz
      - run: pnpm check:packed .scratch/release-candidate.tgz
      - run: npm exec --yes --registry=https://registry.npmjs.org --package=publint@0.3.24 -- publint run .scratch/release-candidate.tgz --strict
      - run: npm exec --yes --registry=https://registry.npmjs.org --package=@arethetypeswrong/cli@0.18.5 -- attw .scratch/release-candidate.tgz --entrypoints . ./liquid-presence ./liquid-effects ./preview ./icon-paths ./package.json --profile esm-only

      - run: pnpm check:next-consumer .scratch/release-candidate.tgz .scratch/next-consumer
      - run: sha256sum .scratch/release-candidate.tgz

      - name: Capture registry and guard release tag
        id: package
        run: |
          npm view @pieai/swimmer-ui-kit version dist-tags versions --json --registry=https://registry.npmjs.org > .scratch/npm-before.json
          node scripts/check-release-metadata.mjs before .scratch/npm-before.json >> "$GITHUB_OUTPUT"

      - name: Publish package
        env:
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          NPM_CONFIG_FETCH_RETRIES: "0"
        run: npm publish .scratch/release-candidate.tgz --tag "$RELEASE_TAG" --provenance --access public --registry https://registry.npmjs.org/

      - name: Verify exact version and distribution tags
        env:
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          # Read-only propagation checks. There is no second publishing attempt.
          for attempt in {1..90}; do
            if npm view "@pieai/swimmer-ui-kit@$RELEASE_VERSION" version dist-tags versions --json --registry=https://registry.npmjs.org > .scratch/npm-after.json &&
              node scripts/check-release-metadata.mjs after .scratch/npm-before.json .scratch/npm-after.json; then
              exit 0
            fi
            echo "Waiting for the exact version and tags (read $attempt/90)."
            sleep 5
          done
          echo "Could not confirm the version and tags. Stop; do not repeat publication." >&2
          exit 1
