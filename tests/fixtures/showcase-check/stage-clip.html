<!doctype html>
<html>
  <head>
    <style>
      .game-ui-showcase-stage {
        max-height: 100px;
        overflow: hidden;
      }
      .game-ui-showcase-stage > div {
        height: 240px;
      }
    </style>
  </head>
  <body style="margin: 0">
    <div class="game-ui-showcase-shell" data-game-ui-kit-type="visual">
      <main class="game-ui-showcase-main">
        <section class="game-ui-showcase-block">
          <div class="game-ui-showcase-demo game-ui-showcase-demo--stage">
            <div class="game-ui-showcase-stage"><div data-game-ui-option-row="true"></div></div>
          </div>
          <ol class="game-ui-showcase-flow">
            <li>Choose</li>
          </ol>
          <div class="game-ui-showcase-code"><pre>code</pre></div>
        </section>
      </main>
    </div>
  </body>
</html>
